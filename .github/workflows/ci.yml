name: CI

on:
  push:
    branches: [main, codex/architecture-hardening-v1]
  pull_request:
  workflow_dispatch:

jobs:
  harness:
    name: Build and test (outside Unity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify architecture invariants
        run: python3 Tools/verify-architecture.py

      - name: Changelog and READMEs match the package version
        run: |
          version=$(jq -r .version Packages/com.nesh.mastermemory-debugger/package.json)
          grep -q "^## \\[$version\\]" Packages/com.nesh.mastermemory-debugger/CHANGELOG.md \\
            || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          for readme in README.md Packages/com.nesh.mastermemory-debugger/README.md; do
            grep -q "#v$version" "$readme" \\
              || { echo "::error::$readme does not pin the install URL to #v$version"; exit 1; }
          done

      - name: Verify changed-file formatting
        shell: bash
        run: |
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            git diff --check "origin/$GITHUB_BASE_REF"...HEAD
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^...HEAD
          fi

      - name: Build every configuration and run the tests
        run: Tools/Harness/run.sh

      - name: Collect code coverage
        run: |
          rm -rf artifacts/coverage
          dotnet test Tools/Harness/Tests/Tests.csproj -nologo -p:ExtraDefines="UNITY_EDITOR" \\
            --collect:"XPlat Code Coverage" --results-directory artifacts/coverage/harness < /dev/null
          dotnet test Tools/RemoteCli.Tests/RemoteCli.Tests.csproj -nologo \\
            --collect:"XPlat Code Coverage" --results-directory artifacts/coverage/cli < /dev/null

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: error
