name: Release

# Tags and releases the package when the version in package.json changes on main.
# Run it by hand with a tag (for example v0.4.0) to create the release of an existing tag.
on:
  push:
    branches: [main]
    paths: [Packages/com.nesh.mastermemory-debugger/package.json]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to create a release for (for example v0.4.0). Empty = the version in package.json.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          package=Packages/com.nesh.mastermemory-debugger
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            version="${tag#v}"
            if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::Tag $tag does not exist."
              exit 1
            fi
          else
            version=$(jq -r .version "$package/package.json")
            tag="v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "$tag already exists."
              exit 0
            fi
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "The release of $tag already exists."
            exit 0
          fi
          # notes: the CHANGELOG section of this version (the CHANGELOG of main lists every version)
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' "$package/CHANGELOG.md" > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          if [ -n "$INPUT_TAG" ]; then
            gh release create "$tag" --verify-tag --title "$tag" --notes-file notes.md
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
          fi
